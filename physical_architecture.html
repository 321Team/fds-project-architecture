<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDS Phase 1 — 물리/네트워크 아키텍처 (Baseline v3.1.19)</title>
</head>
<body>
<p id="boot" style="font-family:sans-serif;padding:24px">물리 아키텍처를 불러오는 중…</p>
<script>
(function () {
  var BASE = "https://raw.githubusercontent.com/321Team/fds-project-architecture/8af821ecf76cd13442210a1bb32b829696200b80/physical_architecture.html";

  function node(p) {
    var cx = p.x + p.w / 2;
    var kind = p.kind;
    var sig = {
      security: '<path d="M8 2.2 13 4v3.5c0 3.1-1.8 5.4-5 6.5-3.2-1.1-5-3.4-5-6.5V4Z"/><path d="m5.8 8 1.5 1.5 3-3"/>',
      backend: '<path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>',
      database: '<ellipse cx="8" cy="4" rx="5.5" ry="2.2"/><path d="M2.5 4v6c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2V4"/>'
    };
    return ""
      + '        <g id="node-' + p.id + '" data-node-id="' + p.id + '" data-node-label="' + p.label + '" tabindex="0" role="button" aria-label="Focus ' + p.label + ', ' + p.sub + ', ' + p.ctx + '" aria-pressed="false" data-node-kind="' + kind + '" data-node-sublabel="' + p.sub + '" data-node-tag="' + p.tag + '" data-node-context="' + p.ctx + '">\n'
      + '          <title>' + p.label + ' · ' + p.sub + ' · ' + p.ctx + ' · ' + p.tag + '</title>\n'
      + '          <rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="6" class="c-mask"/>\n'
      + '          <rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="6" class="c-' + kind + '" stroke-width="1.5"/>\n'
      + '          <g aria-hidden="true" data-semantic-sigil="' + kind + '" class="semantic-sigil s-' + kind + '" transform="translate(' + (p.x + 6) + ' ' + (p.y + 6) + ') scale(0.6875)">' + (sig[kind] || sig.backend) + '</g>\n'
      + '          <text data-node-label="" data-detail-anchor="" x="' + cx + '" y="' + (p.y + 29) + '" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">' + p.label + '</text>\n'
      + '        <text data-detail="context" x="' + cx + '" y="' + (p.y + 45) + '" class="t-muted" font-size="9" text-anchor="middle">' + p.sub + '</text>\n'
      + '        <text data-detail="fine" x="' + cx + '" y="' + (p.y + 54) + '" class="t-' + kind + '" font-size="7" text-anchor="middle">' + p.tag + '</text>\n'
      + '        </g>\n';
  }

  var EXTRA = [
    node({id:"mgmt-gw01", label:"mgmt-gw01 (.58/.1)", sub:"Phys .58 · Mgmt .1", tag:"Dual NIC · SNAT 금지", ctx:"IF-16 return via 10.1.93.58", kind:"security", x:168, y:110, w:156, h:62}),
    node({id:"ansible01", label:"ansible01 (.10)", sub:"Mgmt 10.250.10.10", tag:"server01 · OID-01", ctx:"VMnet1 management", kind:"backend", x:168, y:188, w:150, h:56}),
    node({id:"runner", label:"cicd-runner01 (.20)", sub:"Mgmt 10.250.10.20", tag:"server01 · GitHub 443", ctx:"VMnet1 management", kind:"backend", x:328, y:188, w:160, h:56}),
    node({id:"monitor01", label:"monitor01 (.30)", sub:"Mgmt 10.250.10.30", tag:"External Watchdog", ctx:"VMnet1 management", kind:"backend", x:498, y:188, w:160, h:56}),
    node({id:"api-lb", label:"k8s-api-lb01 (.109)", sub:"Phys 10.1.93.109:6443", tag:"L4OK 관측 · FO NT", ctx:"API LB on server01", kind:"security", x:670, y:110, w:168, h:62}),
    node({id:"dns01", label:"dns01 (.52)", sub:"Phys 10.1.93.52", tag:"P1 Primary BIND", ctx:"server01", kind:"database", x:670, y:188, w:120, h:56}),
    node({id:"dns02", label:"dns02 (.53)", sub:"Phys 10.1.93.53", tag:"P1 Secondary BIND", ctx:"server08", kind:"database", x:800, y:188, w:128, h:56})
  ].join("\n");

  function patch(html) {
    var frameOld = 'data-composition-frame-label="Mgmt 10.250.10.0/24 · VMnet1" x="326" y="86" width="258" height="106"';
    var frameNew = 'data-composition-frame-label="Mgmt 10.250.10.0/24 · VMnet1" x="160" y="86" width="510" height="170"';
    if (html.indexOf(frameOld) === -1) throw new Error("mgmt frame marker missing");
    html = html.replace(frameOld, frameNew);

    var regionOld = 'data-composition-frame-label="Physical FDS Network 10.1.93.0/24 · VMnet0 Bridged · GW .254 · DNS 8.8.8.8" x="148" y="68" width="894" height="459"';
    if (html.indexOf(regionOld) === -1) throw new Error("physical region marker missing");

    var anchor = '        <g id="node-server01"';
    if (html.indexOf(anchor) === -1) throw new Error("server01 node marker missing");
    html = html.replace(anchor, EXTRA + "\n" + anchor);

    html = html.replace('data-node-sublabel="mgmt·ansible·runner·monitor"', 'data-node-sublabel="Windows host"');
    html = html.replace('>mgmt·ansible·runner·monitor</text>', '>Windows host</text>');
    html = html.replace('data-node-tag="API LB .109 · dns01(P1) .52"', 'data-node-tag="host .23 · VMs 분리 표기"');
    html = html.replace('>API LB .109 · dns01(P1) .52</text>', '>host .23 · VMs 분리 표기</text>');

    var probe = '<path data-edge-from="server01" data-edge-to="edge01" data-edge-label="probe :443"';
    var edges = ''
      + '<path data-edge-from="api-lb" data-edge-to="control" data-edge-label="API 6443" data-edge-key="lb-cp" data-composition-points="838,141;850,141" d="M 838 141 L 850 141" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>\n        '
      + '<path data-edge-from="dns01" data-edge-to="dns02" data-edge-label="53" data-edge-key="dns-axfr" data-composition-points="790,216;800,216" d="M 790 216 L 800 216" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>\n        ';
    if (html.indexOf(probe) === -1) throw new Error("probe edge marker missing");
    html = html.replace(probe, edges + probe);

    var viewsOld = '{"id":"mgmt-plane","label":"관리·모니터링","focus":["server01","control","edge01","data","workers"],"note":"server01의 API LB, Runner, monitor01이 제어부·registry·edge를 다루는 흐름."}';
    var viewsNew = '{"id":"mgmt-plane","label":"관리·모니터링","focus":["mgmt-gw01","ansible01","runner","monitor01","api-lb","dns01","dns02","server01","control","edge01","data","workers"],"note":"관리망 .1/.10/.20/.30, API LB .109, dns01/02 .52/.53. server01은 Windows 호스트."}';
    if (html.indexOf(viewsOld) === -1) throw new Error("guided view marker missing");
    html = html.replace(viewsOld, viewsNew);

    var pairs = [
      ['data-node-tag="6/6 Ready 인수 전"', 'data-node-tag="6/6 Ready 관측 · G1 미인수"'],
      ['>6/6 Ready 인수 전</text>', '>6/6 Ready 관측 · G1 미인수</text>'],
      ['data-node-sublabel="server08·3128·인수 전"', 'data-node-sublabel="server08 · .56:3128"'],
      ['>server08·3128·인수 전</text>', '>server08 · .56:3128</text>'],
      ['data-node-tag="v19 신규 · 인수 전"', 'data-node-tag="#74/#75 서비스 인수 전"'],
      ['>v19 신규 · 인수 전</text>', '>#74/#75 서비스 인수 전</text>'],
      ['data-node-sublabel="server08 · Phase 2 미가동"', 'data-node-sublabel="server08 · Phase 2 미착수"'],
      ['>server08 · Phase 2 미가동</text>', '>server08 · Phase 2 미착수</text>'],
      ['data-node-tag="미가동"', 'data-node-tag="P2 미착수"'],
      ['>미가동</text>', '>P2 미착수</text>'],
      ['<h3>인수 전 / 보류</h3>', '<h3>진행 상태 · 2026-09-22</h3>'],
      ['&bull; 6/6 Ready·GNP/HEP · return route DRIFT · NTP upstream 미정', '&bull; G1/G2/G3·P1 Review/Close 미인수. 6/6 Ready 관측(09-18)≠Gate PASS. return route DRIFT. NTP upstream 미정'],
      ['&bull; ROSA→db01 5432 · harbor 443 · S3 443: PROVISIONAL', '&bull; egress #74/#75 In Progress. LB 3/3 L4OK 관측·failover NT. 09-23 발표≠인수. P2 IF-17~20 PROVISIONAL'],
      ['"note":"egress-proxy01 .56:3128, discord.com:443 CONNECT만 허용. 인수 전."', '"note":"egress-proxy01 .56:3128, Discord CONNECT만. #74/#75 서비스 인수 전."'],
      ['6/6 Ready 인수 전', '6/6 Ready 관측 · G1 미인수']
    ];
    for (var i = 0; i < pairs.length; i++) {
      if (html.indexOf(pairs[i][0]) === -1) throw new Error("status marker missing: " + pairs[i][0]);
      html = html.split(pairs[i][0]).join(pairs[i][1]);
    }
    return html;
  }

  fetch(BASE, { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("base fetch HTTP " + res.status);
      return res.text();
    })
    .then(function (html) {
      document.open();
      document.write(patch(html));
      document.close();
    })
    .catch(function (err) {
      var el = document.getElementById("boot");
      el.textContent = "물리 아키텍처 베이스를 불러오지 못했습니다: " + err.message;
    });
})();
</script>
</body>
</html>
