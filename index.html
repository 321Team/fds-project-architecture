<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FDS 아키텍처 문서</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8eef9; background: radial-gradient(circle at top left, #19365f 0, transparent 38%), radial-gradient(circle at bottom right, #123c36 0, transparent 35%), #08111f; }
    main { width: min(960px, calc(100% - 40px)); padding: 72px 0; }
    .eyebrow { margin: 0 0 12px; color: #7dd3fc; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 58px); line-height: 1.08; letter-spacing: -.04em; }
    .intro { max-width: 650px; margin: 20px 0 40px; color: #a9b7ca; font-size: 17px; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .card { display: flex; min-height: 230px; padding: 28px; flex-direction: column; justify-content: space-between; color: inherit; text-decoration: none; border: 1px solid #29415f; border-radius: 20px; background: rgba(15, 29, 49, .82); box-shadow: 0 18px 50px rgba(0, 0, 0, .2); transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .card:hover { transform: translateY(-4px); border-color: #60a5fa; background: rgba(21, 42, 70, .96); }
    .number { color: #7dd3fc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
    h2 { margin: 0 0 10px; font-size: 26px; letter-spacing: -.025em; }
    .card p { margin: 0; color: #9fb0c5; line-height: 1.6; }
    .open { margin-top: 28px; color: #bfdbfe; font-weight: 700; }
    footer { margin-top: 28px; color: #64748b; font-size: 13px; }
    @media (max-width: 680px) { main { padding: 48px 0; } .grid { grid-template-columns: 1fr; } .card { min-height: 200px; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">321Team · FDS Project</p>
    <h1>FDS 아키텍처 문서</h1>
    <p class="intro">Baseline v3.1.19를 기준으로 작성된 논리 및 물리·네트워크 아키텍처를 선택해 확인할 수 있습니다.</p>
    <section class="grid" aria-label="아키텍처 문서 목록">
      <a class="card" href="logical_architecture.html">
        <span class="number">01</span>
        <div>
          <h2>논리 아키텍처</h2>
          <p>서비스 구성요소, 주요 트랜잭션 경로, 모니터링과 CI/CD 흐름을 확인합니다.</p>
          <div class="open">문서 열기 →</div>
        </div>
      </a>
      <a class="card" href="physical_architecture.html">
        <span class="number">02</span>
        <div>
          <h2>물리·네트워크 아키텍처</h2>
          <p>서버와 네트워크 배치, 연결 구조 및 인프라 경계를 확인합니다.</p>
          <div class="open">문서 열기 →</div>
        </div>
      </a>
    </section>
    <footer>321Team · FDS Hybrid Cloud Project</footer>
  </main>
</body>
</html>
